[package]
name = "storylet-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "storylet-engine-host"
path = "src/bin/host.rs"

[[bin]]
name = "storylet-engine-bench"
path = "src/bin/benchmark.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
